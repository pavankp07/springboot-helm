apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: springboot-prod
  namespace: argocd
spec:
  ignoreDifferences: []
  project: default
  source:
    repoURL: https://github.com/pavankp07/springboot-helm.git
    targetRevision: main
    path: .
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
