replicaCount: 1

image:
  tag: "1.27"

springProfile: dev

config:
  LOGGING_LEVEL_ROOT: "DEBUG"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://dev-db:5432/appdb"

secret:
  data:
    SPRING_DATASOURCE_USERNAME: "dev_user"
    SPRING_DATASOURCE_PASSWORD: "dev-placeholder"

ingress:
  enabled: true
  hosts:
    - host: dev.springboot.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi