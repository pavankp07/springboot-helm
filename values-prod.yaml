replicaCount: 3

image:
  tag: "1.27"

springProfile: prod

config:
  LOGGING_LEVEL_ROOT: "WARN"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://prod-db:5432/appdb"

secret:
  data:
    SPRING_DATASOURCE_USERNAME: "prod_user"
    SPRING_DATASOURCE_PASSWORD: "prod-placeholder"

ingress:
  enabled: false
  hosts:
    - host: springboot.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi