replicaCount: 1

image:
  repository: nginx
  tag: "1.27"
  pullPolicy: IfNotPresent

springProfile: default

service:
  type: ClusterIP
  port: 80
  targetPort: 80

config:
  LOGGING_LEVEL_ROOT: "INFO"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  path: /