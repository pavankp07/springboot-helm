replicaCount: 1

image:
  repository: nginx
  tag: ""
  pullPolicy: IfNotPresent

springProfile: default

service:
  type: ClusterIP
  port: 80
  targetPort: 80

# Non-sensitive settings -> ConfigMap
config:
  LOGGING_LEVEL_ROOT: "INFO"

# Sensitive settings -> Secret (placeholders only, never real passwords)
secret:
  enabled: true
  data:
    SPRING_DATASOURCE_USERNAME: "appuser"
    SPRING_DATASOURCE_PASSWORD: "change-me"

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: springboot.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  path: /